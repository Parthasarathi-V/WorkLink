{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-body">
  <h1 class="h4">Log in</h1>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" id="{{ field.id_for_label }}" class="form-control" required>
        {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
    {% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary">Log in</button>
    <a class="btn btn-link" href="{% url 'register' %}">Create account</a>
  </form>
</div></div></div></div>
{% endblock %}
