{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card"><div class="card-body">
  <h1 class="h4">Create your WorkLink account</h1>
  <form method="post" novalidate>{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
        {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
    {% endfor %}
    <button class="btn btn-primary">Register</button>
  </form>
</div></div></div></div>
{% endblock %}
